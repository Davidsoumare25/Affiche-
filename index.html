<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Poème pour mon amour</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background:
                radial-gradient(circle at top, #5b164d, #160817 60%, #050207);
            font-family: Georgia, serif;
            color: white;
            overflow: hidden;
        }

        /* Petites étoiles */
        .stars {
            position: fixed;
            inset: 0;
            pointer-events: none;
        }

        .star {
            position: absolute;
            color: #ffffff;
            opacity: 0.7;
            animation: twinkle 2s infinite alternate;
        }

        .star:nth-child(1) { left: 10%; top: 15%; }
        .star:nth-child(2) { left: 80%; top: 20%; animation-delay: .5s; }
        .star:nth-child(3) { left: 25%; top: 75%; animation-delay: 1s; }
        .star:nth-child(4) { left: 90%; top: 70%; animation-delay: .3s; }
        .star:nth-child(5) { left: 50%; top: 10%; animation-delay: .8s; }

        .card {
            width: 90%;
            max-width: 500px;
            padding: 35px 25px;
            text-align: center;

            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;

            backdrop-filter: blur(12px);

            box-shadow:
                0 0 40px rgba(255, 40, 160, 0.25);
        }

        .heart {
            font-size: 55px;
            animation: heartbeat 1.5s infinite;
        }

        h1 {
            margin: 10px 0;
            font-size: 30px;
            color: #ff9bd5;
            text-shadow: 0 0 15px #ff3fa7;
        }

        .subtitle {
            color: #ddd;
            font-size: 14px;
            margin-bottom: 30px;
        }

        #poeme {
            min-height: 110px;
            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 21px;
            line-height: 1.6;
            color: #fff;
        }

        .phrase {
            animation: apparition 1.2s ease;
        }

        .dots {
            margin-top: 20px;
            color: #ff82c6;
            letter-spacing: 5px;
        }

        @keyframes apparition {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.15);
            }
        }

        @keyframes twinkle {
            from {
                opacity: 0.2;
            }

            to {
                opacity: 1;
            }
        }
    </style>
</head>

<body>

    <div class="stars">
        <span class="star">✦</span>
        <span class="star">✧</span>
        <span class="star">✦</span>
        <span class="star">✧</span>
        <span class="star">✦</span>
    </div>

    <div class="card">

        <div class="heart">❤️</div>

        <h1>Poème pour mon amour</h1>

        <div class="subtitle">
            Quelques mots venant du cœur...
        </div>

        <div id="poeme">
            <div class="phrase">
                Clique et laisse les mots défiler...
            </div>
        </div>

        <div class="dots">• • •</div>

    </div>


    <script>

        const phrases = [
            "Depuis que tu es là, mes journées ont une autre couleur.",
            "Ton sourire a le pouvoir de rendre mes mauvais jours plus doux.",
            "Même parmi des milliers de personnes, mes yeux chercheraient les tiens.",
            "Je ne cherche pas des mots parfaits, seulement des mots sincères.",
            "Tu occupes une petite place dans mon cœur... qui prend pourtant beaucoup de place.",
            "Chaque moment passé avec toi devient un souvenir que je veux garder.",
            "Si le bonheur avait un visage, j'aimerais qu'il ressemble au tien.",
            "Et si je devais recommencer, je choisirais encore de te connaître.",
            "Merci simplement d'être toi. ❤️"
        ];

        let index = 0;

        const poeme = document.getElementById("poeme");

        function afficherPhrase() {

            poeme.innerHTML = "";

            const phrase = document.createElement("div");

            phrase.className = "phrase";

            phrase.textContent = phrases[index];

            poeme.appendChild(phrase);

            index++;

            if (index >= phrases.length) {
                index = 0;
            }
        }

        // Première phrase
        setTimeout(afficherPhrase, 1500);

        // Une nouvelle phrase toutes les 4 secondes
        setInterval(afficherPhrase, 4000);

    </script>

</body>
</html>
